name = "SIDEExplicitFormula"
defaultTargets = ["SIDEExplicitFormula"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11"

[[lean_lib]]
name = "SIDEExplicitFormula"
globs = ["Zeta23.+", "SIDEExplicitFormula.+"]

# Vendored at b566 under (R176)(3): Bulka's li-criterion-rh-equivalence-lean at 35df682f, the closure of
# Lc.LiCriterion.Fidelity (which contains the converse's). Bodies byte-identical under Zeta23's header form.
# The two elaboration options Bulka's package sets are carried; its pretty-printer option and weak linters are not.
[[lean_lib]]
name = "BulkaVendored"
srcDir = "Vendored/Bulka"
roots = ["Lc.LiCriterion.Fidelity"]
globs = ["Lc.+", "Hadamard.+", "FunctionsOfOneComplexVariable.+"]
leanOptions = { autoImplicit = false, maxSynthPendingDepth = 3 }
