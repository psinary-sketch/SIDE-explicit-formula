# build-module -- a hand-dispatched build of one ref, under (R263)(4).
# Inputs: the ref to build and the lake target. Steps: checkout at the ref; elan from its official install script, the toolchain pinned by
# lean-toolchain; lake exe cache get; a free-memory logger beside the build that stops lake if free memory falls beneath the 2,560 MB hold;
# lake build of the target; a scratch file through lake env lean carrying #print axioms for every named terminal; the build log, the memory log
# and the axioms output uploaded as the run's artifact. No secret is used; the platform's own token alone (read-only contents).
# From b658 ((R263)(4), standing): the named terminals are read from print_targets.txt at the kernel's root, one name per line, and the
# scratch file imports each module of the target; no workflow edit is needed to print a new theorem.
# From b692 ((R302)(3)(a)): where the ref carries CircuitClosure.lean (at the root, imported by no module), a closure step imports each module
# of the target above that file's text and runs it; its out/closure.jsonl.gz -- one record per programme constant -- joins the artifact.
# From b706 ((R316)(5), W-ORD-WORKFLOW-PROBE-STEP): where the ref carries ChainProbe.lean (at the root, imported by no module), a probe step
# after the print step and before the closure imports each module of the target above that file's text and runs it; its output goes to a
# SEPARATE artifact (chain-probe-<run id>), so a chain probe needs no scratch branch.
# From b764 ((R374)(7), W-ORD-RUNNER-CACHE): a third input, restore, "off" where it is absent. With it "on", the kernel's own build
# directory (.lake/build) is restored from the runner's cache before the build; after a build that completed under the hold, the directory
# is saved to the cache where its key is not yet held. The key is read once, from lean-toolchain and lake-manifest.json. The cache's record
# (out/cache_kernel.txt) and the build's start and end (out/build_times.txt) join the artifact. A tag is cut on a run with the restore off
# and on no other.
# From b765 ((R375)(4), W-ORD-RUNNER-CACHE, the design of relay data/b764_misses.txt (4)): the save keyed by the toolchain, the manifest and
# the commit built (the checked-out HEAD), the restore by the prefix of the toolchain and the manifest, the latest save under that prefix
# restored; the restored key joins the cache's record; a run with the restore off neither restores nor saves.
# From b765 by the author's word of 2026-11-21 on the runner's cache (relay data/b765_amendments.json row 2): a fourth input, planted, "off"
# where it is absent. With it "on", each file that push-b765-planted changes against its parent is taken into the checkout after the restore
# and before the build, refused unless the file at the commit built equals the parent's; the commit built, and so the cache's key, stays the
# checked-out HEAD, and no planted commit enters the branch built; the probe and the save are not run; out/planted.txt joins the artifact.
name: build-module

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "the commit SHA or branch to build"
        required: true
      target:
        description: "the lake target to build"
        required: true
      restore:
        description: "on: restore the kernel's own build directory from the runner's cache before the build; off, its value where absent: build from source"
        required: false
        type: choice
        options:
          - "off"
          - "on"
        default: "off"
      planted:
        description: "on: take each file push-b765-planted changes against its parent into the checkout before the build, no save; off, its value where absent"
        required: false
        type: choice
        options:
          - "off"
          - "on"
        default: "off"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HOLD_MB: "2560"
      TARGET: ${{ inputs.target }}
      RESTORE: ${{ inputs.restore }}
      PLANTED: ${{ inputs.planted || 'off' }}
      PLANTED_REF: push-b765-planted
    steps:
      - name: Checkout at the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Refuse a target outside the lake grammar
        run: |
          case "$TARGET" in
            *[!A-Za-z0-9_.\ ]*|"") echo "target refused: $TARGET"; exit 2 ;;
          esac
          case "$RESTORE" in
            on|off) ;;
            *) echo "restore refused: $RESTORE"; exit 2 ;;
          esac
          case "$PLANTED" in
            on|off) ;;
            *) echo "planted refused: $PLANTED"; exit 2 ;;
          esac
          mkdir -p out
          git rev-parse HEAD > out/ref.txt
          cat lean-toolchain >> out/ref.txt
          echo "planted input: $PLANTED" > out/planted.txt

      - name: Install elan (official script; the toolchain from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib cache
        run: lake exe cache get 2>&1 | tail -20 > out/cache.log

      - name: The kernel cache's key, read once from the toolchain and the manifest, with the commit built
        id: key
        run: |
          p="kernel-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-"
          echo "prefix=$p" >> "$GITHUB_OUTPUT"
          echo "key=$p$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the kernel's own build from the runner's cache (the input restore on), by the prefix where the key is not held
        id: restore
        if: inputs.restore == 'on'
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      - name: Record the restore
        env:
          KEY: ${{ steps.key.outputs.key }}
          HIT: ${{ steps.restore.outputs.cache-hit }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          echo "restore input: $RESTORE" >> out/cache_kernel.txt
          echo "key: $KEY" >> out/cache_kernel.txt
          echo "restore hit: ${HIT:-none}" >> out/cache_kernel.txt
          echo "restored key: ${MATCHED:-none}" >> out/cache_kernel.txt
          if [ -d .lake/build ]; then n=$(find .lake/build -type f | wc -l); else n=0; fi
          echo "files under .lake/build before the build: $n" >> out/cache_kernel.txt

      - name: Take the planted files from push-b765-planted into the checkout (the input planted on)
        if: inputs.planted == 'on'
        run: |
          git fetch --no-tags --depth=2 origin "+refs/heads/$PLANTED_REF:refs/remotes/origin/$PLANTED_REF"
          tip=$(git rev-parse "refs/remotes/origin/$PLANTED_REF")
          base=$(git rev-parse "$tip^")
          echo "planted ref: $PLANTED_REF" >> out/planted.txt
          echo "planted tip: $tip" >> out/planted.txt
          echo "planted parent: $base" >> out/planted.txt
          git diff --name-only "$base" "$tip" > out/planted_files.txt
          n=0
          while IFS= read -r f || [ -n "$f" ]; do
            [ -z "$f" ] && continue
            case "$f" in
              *.lean) ;;
              *) echo "planted file refused (no .lean file): $f" >> out/planted.txt; exit 2 ;;
            esac
            if [ "$(git rev-parse "HEAD:$f")" != "$(git rev-parse "$base:$f")" ]; then
              echo "planted file refused (the file at the commit built differs from the parent's): $f" >> out/planted.txt; exit 2
            fi
            git show "$tip:$f" > "$f"
            echo "planted file: $f sha256 $(sha256sum "$f" | cut -d' ' -f1)" >> out/planted.txt
            n=$((n+1))
          done < out/planted_files.txt
          echo "planted files: $n" >> out/planted.txt
          echo "the commit built: $(git rev-parse HEAD)" >> out/planted.txt

      - name: Build under the hold
        run: |
          (
            while true; do
              avail=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) avail_mb=$avail" >> out/mem.log
              if [ "$avail" -lt "$HOLD_MB" ]; then
                echo "STOP $(date -u +%Y-%m-%dT%H:%M:%SZ) avail_mb=$avail beneath the hold $HOLD_MB" >> out/mem.log
                pkill -f lake || true
                pkill -f lean || true
              fi
              sleep 5
            done
          ) &
          LOGGER=$!
          set +e
          echo "build start $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> out/build_times.txt
          lake build $TARGET > out/build.log 2>&1
          echo "$?" > out/build_exit.txt
          echo "build end $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> out/build_times.txt
          kill "$LOGGER" || true
          awk -F'avail_mb=' '/avail_mb=/ {split($2,a," "); if (min=="" || a[1]+0<min) min=a[1]+0} END {print "LOW " min}' out/mem.log >> out/mem.log
          exit 0

      - name: Read whether the build completed under the hold
        id: built
        if: always()
        run: |
          if [ "$(cat out/build_exit.txt)" = "0" ] && ! grep -q '^STOP ' out/mem.log; then ok=true; else ok=false; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Look up the kernel cache's key before the save
        id: probe
        if: always() && inputs.restore == 'on' && inputs.planted != 'on' && steps.built.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Save the kernel's own build to the runner's cache, where its key is not yet held
        id: save
        if: always() && inputs.restore == 'on' && inputs.planted != 'on' && steps.built.outputs.ok == 'true' && steps.probe.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ steps.key.outputs.key }}

      - name: Record the save
        if: always()
        env:
          OK: ${{ steps.built.outputs.ok }}
          PRESENT: ${{ steps.probe.outputs.cache-hit }}
          SAVED: ${{ steps.save.outcome }}
        run: |
          echo "build completed under the hold: ${OK:-none}" >> out/cache_kernel.txt
          echo "key present before the save: ${PRESENT:-none}" >> out/cache_kernel.txt
          echo "save step: ${SAVED:-none}" >> out/cache_kernel.txt

      - name: Axioms of the named terminals
        if: always()
        run: |
          : > out/Axioms.lean
          for m in $TARGET; do echo "import $m" >> out/Axioms.lean; done
          cp print_targets.txt out/print_targets.txt
          while IFS= read -r n || [ -n "$n" ]; do
            n=$(printf '%s' "$n" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$n" ] && continue
            case "$n" in
              *[!A-Za-z0-9_.\']*) echo "print target refused: $n" >> out/axioms_refused.txt; continue ;;
            esac
            echo "#print axioms $n" >> out/Axioms.lean
          done < print_targets.txt
          if [ "$(cat out/build_exit.txt)" = "0" ] && ! grep -q '^STOP ' out/mem.log; then
            lake env lean out/Axioms.lean > out/axioms.txt 2>&1 || true
          else
            echo "NOT RUN: the build did not complete under the hold" > out/axioms.txt
          fi

      - name: Chain probe of the ref's root ChainProbe.lean
        if: always()
        run: |
          mkdir -p probe
          if [ ! -f ChainProbe.lean ]; then
            echo "NOT RUN: no ChainProbe.lean at the ref" > probe/chainprobe_log.txt
          elif [ "$(cat out/build_exit.txt)" = "0" ] && ! grep -q '^STOP ' out/mem.log; then
            : > probe/ChainProbe.lean
            for m in $TARGET; do echo "import $m" >> probe/ChainProbe.lean; done
            cat ChainProbe.lean >> probe/ChainProbe.lean
            lake env lean probe/ChainProbe.lean > probe/chainprobe.txt 2>&1 || true
            echo "RUN: ChainProbe.lean at the ref, its print in probe/chainprobe.txt" > probe/chainprobe_log.txt
          else
            echo "NOT RUN: the build did not complete under the hold" > probe/chainprobe_log.txt
          fi

      - name: Constant closure of the kernel's own declarations
        if: always()
        run: |
          if [ ! -f CircuitClosure.lean ]; then
            echo "NOT RUN: no CircuitClosure.lean at the ref" > out/closure_log.txt
          elif [ "$(cat out/build_exit.txt)" = "0" ] && ! grep -q '^STOP ' out/mem.log; then
            : > out/Closure.lean
            for m in $TARGET; do echo "import $m" >> out/Closure.lean; done
            cat CircuitClosure.lean >> out/Closure.lean
            lake env lean out/Closure.lean > out/closure_log.txt 2>&1 || true
            if [ -f out/closure.jsonl ]; then gzip -9 -n out/closure.jsonl; fi
          else
            echo "NOT RUN: the build did not complete under the hold" > out/closure_log.txt
          fi

      - name: Upload the run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-module-${{ github.run_id }}
          path: out/
          if-no-files-found: error

      - name: Upload the chain probe's artifact, separate from the run's
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-probe-${{ github.run_id }}
          path: probe/
          if-no-files-found: ignore
